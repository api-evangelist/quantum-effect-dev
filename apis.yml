name: Quantum Effect Dev
description: 'Quantum Effect Devices (QED, originally Quantum Effect Design) was a
  fabless semiconductor company founded in 1991 by former MIPS Computer Systems managers
  Tom Riordan, Earl Killian, and Ray Kunita. QED designed MIPS-based 32- and 64-bit
  embedded RISC microprocessors (the RM5200 and RM7000 families) for networking and
  communications systems including routers, switches, and optical transport equipment.
  The company completed an IPO in 2000 and was acquired the same year by PMC-Sierra
  for approximately $2.3 billion. It has no independent operations, developer platform,
  or API surface today; the former corporate site (qedinc.com) is defunct. This record
  was surfaced as a Lightspeed Venture Partners portfolio company and is retained as
  a historical/no-API-surface entry.'
